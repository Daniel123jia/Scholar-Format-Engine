name: Scholar-Format-Engine
version: 1.4.0
description: >
  Shared formatting and export engine for academic/research products. Converts
  structured research outputs into consistent editable DOCX and clean Markdown
  using reusable Style Packs, deterministic rendering, layered semantic layouts,
  and structural/visual QA.

skill_file: ../SKILL.md
schemas:
  document_ir: ../schemas/document-content.schema.json
  style_pack: ../schemas/style-pack.schema.json
  delivery_request: ../schemas/delivery-request.schema.json

first_class_outputs:
  - docx
  - markdown

adapters:
  - deep-reading-v1.6

principles:
  - content_and_formatting_are_separate
  - deterministic_format_execution
  - real_word_named_styles
  - hide_backend_jargon
  - preserve_claim_evidence_traceability
  - semantic_cards_should_stay_together
  - render_and_verify_docx_before_delivery
