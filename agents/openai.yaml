name: Scholar-Format-Engine
version: 1.1.0
description: >
  Shared academic formatting and export engine. Converts structured outputs from
  AI paper deep reading, academic writing, literature review, peer review,
  reviewer response, proposals, theses, and research reports into consistent
  editable DOCX and clean Markdown using deterministic Style Packs and QA.

skill_file: ../SKILL.md
style_schema_file: ../schemas/style-pack.schema.json
document_schema_file: ../schemas/document-content.schema.json

trigger_phrases:
  - export research report
  - format academic document
  - generate Word report
  - 导出 Word
  - 科研文档排版
  - 论文精读报告导出
  - 学术文档格式化

outputs:
  - docx
  - markdown

principles:
  - upstream skills own scientific content
  - deterministic code owns final formatting
  - named Word styles are required
  - human-facing reports hide backend enums by default
  - deep-reading evidence is deduplicated by default
  - DOCX must pass structural QA and visual QA when rendering is available
