pack:
  name: ai-deep-reading
  version: "1.0"
  description: Evidence-aware AI paper deep-reading report style.
page:
  size: A4
  orientation: portrait
  margins_mm: {top: 25.4, bottom: 25.4, left: 26.0, right: 26.0}
features:
  toc: true
  toc_title: 目录
  toc_page_break_after: true
  page_numbers: true
  metadata_table: true
  header_text: "AI论文精读报告"
  footer_text: null
  markdown_front_matter: true
roles:
  title:
    font: {latin: "Times New Roman", east_asia: "Microsoft YaHei", size_pt: 20, bold: true, italic: false, color: "111827"}
    paragraph: {alignment: center, line_spacing: 1.15, space_before_pt: 0, space_after_pt: 14, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: true}
  subtitle:
    font: {latin: "Times New Roman", east_asia: "Microsoft YaHei", size_pt: 11, bold: false, italic: false, color: "4B5563"}
    paragraph: {alignment: center, line_spacing: 1.1, space_before_pt: 0, space_after_pt: 12, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: true}
  heading1:
    font: {latin: "Times New Roman", east_asia: "Microsoft YaHei", size_pt: 16, bold: true, italic: false, color: "111827"}
    paragraph: {alignment: left, line_spacing: 1.15, space_before_pt: 14, space_after_pt: 7, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: true}
  heading2:
    font: {latin: "Times New Roman", east_asia: "Microsoft YaHei", size_pt: 13.5, bold: true, italic: false, color: "1F2937"}
    paragraph: {alignment: left, line_spacing: 1.15, space_before_pt: 10, space_after_pt: 5, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: true}
  heading3:
    font: {latin: "Times New Roman", east_asia: "Microsoft YaHei", size_pt: 11.5, bold: true, italic: false, color: "374151"}
    paragraph: {alignment: left, line_spacing: 1.15, space_before_pt: 8, space_after_pt: 4, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: true}
  body:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 11, bold: false, italic: false, color: "111827"}
    paragraph: {alignment: left, line_spacing: 1.5, space_before_pt: 0, space_after_pt: 6, first_line_indent_chars: 2, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  lead:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 11.5, bold: false, italic: false, color: "111827"}
    paragraph: {alignment: left, line_spacing: 1.45, space_before_pt: 0, space_after_pt: 8, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  quote:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10, bold: false, italic: false, color: "374151"}
    paragraph: {alignment: left, line_spacing: 1.35, space_before_pt: 4, space_after_pt: 6, first_line_indent_chars: 0, left_indent_cm: 0.8, right_indent_cm: 0.5, keep_with_next: false}
  evidence:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10, bold: false, italic: false, color: "1F2937"}
    paragraph: {alignment: left, line_spacing: 1.35, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  analysis:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10.5, bold: false, italic: false, color: "1F2937"}
    paragraph: {alignment: left, line_spacing: 1.4, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  warning:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10.5, bold: false, italic: false, color: "78350F"}
    paragraph: {alignment: left, line_spacing: 1.4, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  limitation:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10.5, bold: false, italic: false, color: "7F1D1D"}
    paragraph: {alignment: left, line_spacing: 1.4, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  note:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10, bold: false, italic: false, color: "4B5563"}
    paragraph: {alignment: left, line_spacing: 1.3, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  reviewer_comment:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10.5, bold: false, italic: false, color: "7C2D12"}
    paragraph: {alignment: left, line_spacing: 1.4, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  author_response:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 10.5, bold: false, italic: false, color: "14532D"}
    paragraph: {alignment: left, line_spacing: 1.4, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  caption:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 9.5, bold: false, italic: false, color: "374151"}
    paragraph: {alignment: center, line_spacing: 1.1, space_before_pt: 3, space_after_pt: 7, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  table:
    font: {latin: "Times New Roman", east_asia: "SimSun", size_pt: 9.5, bold: false, italic: false, color: "111827"}
    paragraph: {alignment: left, line_spacing: 1.15, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
  table_header:
    font: {latin: "Times New Roman", east_asia: "Microsoft YaHei", size_pt: 9.5, bold: true, italic: false, color: "111827"}
    paragraph: {alignment: center, line_spacing: 1.1, space_before_pt: 0, space_after_pt: 0, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: true}
  code:
    font: {latin: "Consolas", east_asia: "Microsoft YaHei", size_pt: 9.5, bold: false, italic: false, color: "111827"}
    paragraph: {alignment: left, line_spacing: 1.15, space_before_pt: 3, space_after_pt: 5, first_line_indent_chars: 0, left_indent_cm: 0.6, right_indent_cm: 0.6, keep_with_next: false}
  equation:
    font: {latin: "Cambria Math", east_asia: "Cambria Math", size_pt: 11, bold: false, italic: true, color: "111827"}
    paragraph: {alignment: center, line_spacing: 1.2, space_before_pt: 5, space_after_pt: 5, first_line_indent_chars: 0, left_indent_cm: 0, right_indent_cm: 0, keep_with_next: false}
table:
  preset: three_line
  repeat_header: true
  autofit: true
  header_fill: null
  border_color: "6B7280"
callouts:
  evidence: {fill: "F0F9FF", border_color: "0284C7"}
  analysis: {fill: "F5F3FF", border_color: "7C3AED"}
  note: {fill: "F9FAFB", border_color: "9CA3AF"}
  warning: {fill: "FFF7ED", border_color: "EA580C"}
  limitation: {fill: "FEF2F2", border_color: "DC2626"}
  reviewer_comment: {fill: "FFF7ED", border_color: "C2410C"}
  author_response: {fill: "F0FDF4", border_color: "16A34A"}
